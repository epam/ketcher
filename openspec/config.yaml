schema: spec-driven

context: |
  ## Project: Ketcher

  Ketcher is an open-source chemical structure editor built with TypeScript and React.
  It renders molecules, reactions, macromolecules, and monomers using a custom MVC
  architecture over SVG. It is a TypeScript/React monorepo (npm workspaces) with four
  packages: ketcher-core, ketcher-react, ketcher-macromolecules, ketcher-standalone.

  ## Knowledge base

  Read `AGENTS.md` before creating any artifact. It maps where project knowledge lives.
  Current product behavior is in `openspec/specs/`; the feature files in
  `.memory-bank/features/` point to those specs.

  ### Additional rules for opsx:apply
  - Only update the memory bank when archiving a change. Do not update it for proposals or specs in progress.
  - When completeing tasks then mark them as done one by one to not lose track of what has been done and what is left to do. Do not mark all tasks as done at once at the end.
  - Before starting writing e2e playwrite tests always ask to proceed, to ensure that context is not overloaded.
  - Before writing e2e playwrite tests read `.memory-bank/testing/testing.md` to understand the test strategy and existing test coverage.

  ### Additional rules for opsx:archive
  - When updating any of the memory bank files, keep the format of the file you edit.