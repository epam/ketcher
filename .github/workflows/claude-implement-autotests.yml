name: Claude Implement Autotests
 
on:
  issues:
    types: [labeled]
 
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

# The model Claude runs on. Set the AUTOTEST_MODEL repository variable to
# change it without a code change; the default applies when it is unset.
env:
  AUTOTEST_MODEL: ${{ vars.AUTOTEST_MODEL || 'claude-sonnet-5-5' }}

jobs:
  implement-autotests:
    if: |
      github.event.label.name == 'Run TA creation workflow' &&
      contains(github.event.issue.labels.*.name, 'Autotests') &&
      (
        github.event.issue.issue_type.name == 'Task' ||
        github.event.issue.type.name == 'Task' ||
        github.event.issue.issue_type == 'Task' ||
        github.event.issue.type == 'Task'
      )
    runs-on: ubuntu-latest
    environment: ai-workflows
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
 
      # The spec file name and the Version line come from the feature issue,
      # which is the first issue link under "Source task(s):".
      - name: Extract and check data
        id: issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            /**
             * Returns the number of the first issue linked under "Source task(s):".
             * @param {string} body Autotest Request issue body.
             * @returns {number | null} Feature issue number, or null when there is no link.
             */
            const findFeatureNumber = (body) => {
              const match = body.match(/Source task\(s\):[\s\S]*?\/issues\/(\d+)/);
              return match ? Number(match[1]) : null;
            };
 
            /**
             * Turns a feature title into the Feature-Name part of a spec file name.
             * @param {string} title Feature issue title.
             * @returns {string} Title with every run of other characters replaced by one hyphen.
             */
            const toFileNamePart = (title) =>
              title.replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
 
            /**
             * Takes the release version from a milestone title, without the -rc.N suffix.
             * @param {string} milestoneTitle Milestone title, such as "Ketcher 3.13.0-rc.1".
             * @returns {string | null} Version, such as "3.13.0", or null when the title has none.
             */
            const toVersion = (milestoneTitle) => milestoneTitle.match(/\d+\.\d+\.\d+/)?.[0] || null;
 
            const issue = context.payload.issue;
            if (!issue) {
              throw new Error('No issue found in context');
            }
 
            const issueBody = issue.body || '';
            const checklistMatches = issueBody.match(/^\s*-\s\[(?: |x|X)\]\s+.+$/gm) ?? [];
            if (checklistMatches.length === 0) {
              throw new Error('Autotest Request issue must contain at least one markdown checklist item before PR generation can start.');
            }
 
            const featureNumber = findFeatureNumber(issueBody);
            if (featureNumber === null) {
              throw new Error('Autotest Request issue must link the feature issue under "Source task(s):".');
            }
 
            const { data: feature } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: featureNumber,
            });
 
            const version = toVersion(feature.milestone?.title || '');
            if (version === null) {
              throw new Error(`Feature issue #${featureNumber} must have a release milestone. The Version line of the comment block comes from it.`);
            }
 
            core.setOutput('issue_body', issueBody);
            core.setOutput('checklist_count', String(checklistMatches.length));
            core.setOutput('spec_file_name', `${featureNumber}-${toFileNamePart(feature.title)}.spec.ts`);
            core.setOutput('version', version);
 
      # Checks the branch before Claude runs, so a rerun does not spend the
      # Claude run and then fail at the push. An open PR on the branch stops
      # the job. A branch left from a closed PR is replaced at the push, with a
      # lease on the commit seen here (empty when the branch does not exist).
      - name: Create branch for the autotests
        id: vars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="autotests/${ISSUE_NUMBER}"
          OPEN_PR=$(gh pr list --repo "$REPOSITORY" --head "$BRANCH" --state open \
            --json url,isCrossRepository --jq '[.[] | select(.isCrossRepository | not)][0].url // ""')
          if [ -n "$OPEN_PR" ]; then
            echo "::error::Branch ${BRANCH} has an open PR: ${OPEN_PR}. Close that PR, or work on it, before running the workflow again."
            exit 1
          fi
          REMOTE_SHA=$(git ls-remote --heads origin "refs/heads/${BRANCH}" | cut -f1)
          if [ -n "$REMOTE_SHA" ]; then
            echo "Branch ${BRANCH} exists at ${REMOTE_SHA} with no open PR. The push will replace it."
          fi
          git checkout -b "$BRANCH"
          echo "branch_name=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "remote_sha=$REMOTE_SHA" >> "$GITHUB_OUTPUT"
 
      # The issue text is part of the prompt, so Claude gets only what writing
      # the spec needs: it can read the repository and write files under
      # ketcher-autotests/. It cannot run commands, commit, or push; the next
      # step does that. Read the issue text before adding the label.
      - name: Implement autotests with Claude
        uses: anthropics/claude-code-action@c84e279f859e2591391e95bd309286eb111c345f # v1.0.284
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model ${{ env.AUTOTEST_MODEL }}
            --allowedTools "Read" "Glob" "Grep" "Edit(ketcher-autotests/**)" "Write(ketcher-autotests/**)"
          prompt: |
            Follow the generate-autotests skill (.agents/skills/generate-autotests/SKILL.md) to write a Playwright autotest for this Autotest Request.
 
            AUTOTEST_REQUEST_NUMBER: ${{ github.event.issue.number }}
            AUTOTEST_REQUEST_TITLE: ${{ github.event.issue.title }}
            AUTOTEST_REQUEST_URL: ${{ github.event.issue.html_url }}
            SPEC_FILE_NAME: ${{ steps.issue.outputs.spec_file_name }}
            KETCHER_VERSION: ${{ steps.issue.outputs.version }}
            AUTOTEST_REQUEST_DETAILS:
            ${{ steps.issue.outputs.issue_body }}
 
            Rules for this run:
            - Name the spec file SPEC_FILE_NAME. Put it in the folder that .memory-bank/testing/testing.md ("Naming") gives for the mode the feature is tested in.
            - Write one test for each checklist item in AUTOTEST_REQUEST_DETAILS, in the same order. Start each test title with the item number, such as `Case 3 - ...`.
            - If a checklist item cannot be automated, do not leave it out. Add it as `test.skip` with the same title, and a comment that gives the reason and links AUTOTEST_REQUEST_URL.
            - The Version line of each comment block is KETCHER_VERSION.
            - Keep every test-data file the spec uses in the feature folder that .memory-bank/testing/testing.md gives. Copy a file from another folder there; do not reference it in its old folder.
            - Do not run the tests, and do not commit or push. The workflow commits your changes under ketcher-autotests/ and opens the PR.
 
      # A script, not the model, makes sure that every test-data file of the
      # spec is in the feature folder: it copies files from other folders and
      # rewrites the paths in the spec.
      - name: Keep the test data in the feature folder
        env:
          SPEC_FILE_NAME: ${{ steps.issue.outputs.spec_file_name }}
        run: node scripts/autotests/move-test-data.mjs "$SPEC_FILE_NAME" > "$RUNNER_TEMP/test-data.md"

      - name: Commit and push the autotests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BRANCH_NAME: ${{ steps.vars.outputs.branch_name }}
          REMOTE_SHA: ${{ steps.vars.outputs.remote_sha }}
        run: |
          git add -- ketcher-autotests
          if git diff --cached --quiet; then
            echo "Claude made no changes under ketcher-autotests/." >&2
            exit 1
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "#${ISSUE_NUMBER} - ${ISSUE_TITLE}"
          # An empty REMOTE_SHA makes the lease require that the branch does not exist yet.
          git push --force-with-lease="refs/heads/${BRANCH_NAME}:${REMOTE_SHA}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:refs/heads/${BRANCH_NAME}"
 
      # The PR body shows both counts, so a reviewer sees a missing test at once.
      - name: Create pull request
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BRANCH_NAME: ${{ steps.vars.outputs.branch_name }}
          CHECKLIST_COUNT: ${{ steps.issue.outputs.checklist_count }}
        run: |
          TEST_COUNT=$(git show --name-only --format= HEAD -- 'ketcher-autotests/*.spec.ts' \
            | xargs -r cat \
            | grep -cE '^\s*test(\.skip)?\(' || true)
          BODY=$(printf 'Closes #%s\n\nChecklist items in the issue: %s. Tests in the spec, test.skip included: %s.\n\n%s\n' \
            "$ISSUE_NUMBER" "$CHECKLIST_COUNT" "$TEST_COUNT" "$(cat "$RUNNER_TEMP/test-data.md")")
          PR_URL=$(gh pr create \
            --title "#${ISSUE_NUMBER} - ${ISSUE_TITLE}" \
            --body "$BODY" \
            --head "${BRANCH_NAME}" \
            --base master)
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
 
      - name: Comment on issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
        run: |
          gh issue comment "${ISSUE_NUMBER}" \
            --body "Generated Playwright test: ${PR_URL}"
