name: Claude PR Review

on:
  pull_request:
    types: [labeled]

jobs:
  review:
    if: |
      contains(github.event.pull_request.labels.*.name, 'Run Claude Review') &&
      !contains(github.event.pull_request.title, 'Autotests')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # claude-code-action restores .claude from origin/master (PR head is
      # untrusted), but not .agents. On a branch created before the skills
      # restructure, .agents/skills lacks review-pr, so the symlink that the
      # restore brings in is broken, /review-pr does not load, and the run
      # ends green with no review posted. Replace .agents with master's copy
      # so the skill set matches what .claude points at. CLAUDE.md, which the
      # action also restores, imports AGENTS.md, so take AGENTS.md from master
      # too; otherwise a PR could change the instructions of its own review.
      # This copies files only; nothing from the PR head is executed.
      - name: Align agent config with master
        run: |
          git fetch origin master --depth 1
          rm -rf .agents AGENTS.md
          git checkout origin/master -- .agents AGENTS.md

      - name: PR Review with Progress Tracking
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/review-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}"
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment" "Bash(gh pr view:*)" "Bash(gh pr diff:*)" "Bash(gh issue view:*)" "Bash(gh pr comment:*)"
            --model "claude-opus-5-5"