name: Danger

# pull_request_target, so the token can comment on PRs from forks.
# Safe only while no step checks out or runs code from the PR: the checkout
# below is the base branch, and dangerfile.ts reads the PR through the API.
on:
  pull_request_target:
    types:
      [
        opened,
        edited,
        synchronize,
        reopened,
        labeled,
        unlabeled,
        ready_for_review,
        review_requested,
        review_request_removed,
      ]
    branches:
      - master
      - 'release/**'

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: danger-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  danger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm

      - name: Install Danger
        run: npm ci --ignore-scripts

      - name: Run Danger
        run: npx danger ci --failOnErrors
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
