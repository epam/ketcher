# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: CI

on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:
    branches:
      - master
      - 'release/**'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.20.0]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Get npm cache directory path
        id: npm-cache-dir-path
        run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: npm-cache # use this to check for `cache-hit` (`steps.npm-cache.outputs.cache-hit != 'true'`)
        with:
          path: ${{ steps.npm-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Dependencies
        run: npm ci

      - name: Run audit
        run: npm audit --all --audit-level=critical

      - name: Run build
        run: npx cross-env CI=false npm run build

      - name: Run tests
        run: npm test
        env:
          CI: true

      - name: Validate OpenSpec
        run: |
          npx openspec validate --all --strict --no-interactive
          npx openspec validate --archived --no-interactive
        env:
          OPENSPEC_TELEMETRY: 0

      - name: Run build example-ssr
        run: npm run build
        working-directory: example-ssr

      - name: Run lint example-ssr
        run: npm run lint
        working-directory: example-ssr

      - name: Run test example-ssr
        run: npm run test:types
        working-directory: example-ssr

      - name: Check autotests code
        run: npm run check:autotests
