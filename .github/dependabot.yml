version: 2
updates:
  # Workflow actions are pinned to commit SHAs. Once a quarter Dependabot
  # moves the SHAs and the version comments to new releases.
  # Minor and patch updates come in one grouped PR. Each major update comes
  # in its own PR, because a major version can remove or rename inputs:
  # read its release notes before you approve it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch